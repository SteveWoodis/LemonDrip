<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LemonDrip Event Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🍋 LemonDrip Event Manager</h1>
    <div class="header-buttons">
      <button id="btnSearch" onclick="navigateTo('searchSection')">🔍 Search</button>
      <button id="btnAdd" onclick="navigateTo('addSection')">➕ Add Event</button>
      <button id="btnEdit" onclick="navigateTo('editSection')">✏️ Edit</button>
      <button onclick="clearSearch()">🧹 Reset</button>
    </div>
  </header>

  <!-- 🔍 Search Section -->
  <section id="searchSection" class="card">
    <h2>Search Events</h2>
    <div class="search-fields">
      <input type="text" id="searchName" placeholder="Event Name">
      <input type="date" id="searchDate">
      <input type="text" id="searchID" placeholder="Event ID">
      <button onclick="searchEvents()">Search</button>
	<button onclick="clearSearch()">Clear</button>											  
    </div>

  <!-- 🍋 Event Summary Header -->
	<div id="summaryCard" style="display:none;">
		<span id="summaryText">0 events found</span>
		<button id="backToResults" style="display:none;">Back to Results</button>
	</div>

    <section class="card">
      <h3>Search Results (Click to Load Event)</h3>
		<div id="searchResultsContainer">
			<table id="searchResults"></table>
		</div>
	</section>

  <!-- ➕ Add Event Section -->
  <section id="addSection" class="card hidden">
    <h2>Add New Event</h2>
    <form id="eventForm" onsubmit="submitEvent(); return false;">
      <label>Event Name: <input type="text" id="formEventName" required></label><br>
      <label>Event Date: <input type="date" id="formEventDate" required></label><br>
      <label>Event Color: <input type="color" id="formEventColor"></label><br>
      <label>Coordinator: <input type="text" id="formEventCoordinator"></label><br>
      <label>Event Fee: <input type="number" id="formEventFee" step="0.01"></label><br>
      <label>Location: <input type="text" id="formEventLocation"></label><br>
      <label>Time(s): <input type="text" id="formEventTime"></label><br>
      <label>Docs: <input type="text" id="formEventDocs"></label><br>
      <label>Employees: <input type="text" id="formEventEmployees"></label><br>
      <label>Rating: <input type="text" id="formEventRating"></label><br>
      <label>Host: <input type="text" id="formEventHost"></label><br>
      <label>Notes: <textarea id="formEventNotes"></textarea></label><br>
      <label>Status: <input type="text" id="formEventStatus"></label><br>

      <div class="form-buttons">
        <button type="submit">💾 Save Event</button>
        <button type="button" onclick="navigateTo('searchSection')">⬅️ Cancel</button>
      </div>
    </form>
  </section>

  <!-- ✏️ Edit Section -->
  <section id="editSection" class="card hidden">
    <h2>Edit Event (Coming Soon)</h2>
    <p>Editing functionality will be added in a future update.</p>
  </section>

  <!-- 📊 Dashboard Section -->
  <section id="dashboardSection" class="card hidden">
    <div id="dashboard" style="display:none;">
      <h2 id="dashTitle"></h2>
      <p id="dashDate"></p>
      <p><strong>Coordinator:</strong> <span id="dashCoordinator"></span></p>
      <p><strong>Total Sales:</strong> <span id="dashSales"></span></p>
      <p><strong>Net Profit:</strong> <span id="dashProfit"></span></p>
      <p><strong>Square Info:</strong> <span id="dashSquareInfo"></span></p>
      <div id="dashDetails"></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
