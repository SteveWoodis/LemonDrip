# fly.toml app configuration file generated for lemondrip on 2026-02-06T18:39:58-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'venview'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # 👈 CHANGE THIS


[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "lemondrip_data"
  destination = "/data"

[env]  
DOPPLER_PROJECT = "venview"
DOPPLER_CONFIG = "production"

